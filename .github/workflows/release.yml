name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # to create the GitHub Release

# PyPI publishing is intentionally manual via `make publish` (twine).
# This workflow builds the wheel + sdist and cuts a GitHub Release with
# the changelog slice and artifacts attached — the maintainer uploads
# to PyPI separately.

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install hatch
        run: pip install hatch

      - name: Build
        run: hatch build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract changelog slice
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk "/^## \\[$version\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Release $version" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
