coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 100%
        threshold: 0%
comment:
  layout: "header, diff, flags, components"
  require_changes: true

flag_management:
  default_rules:
    carryforward: true

ignore:
  - "tests/**"
  - "features/**"
  - "bench/**"
  - "docs/**"
